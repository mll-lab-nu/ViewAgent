# Validation envs for Habitat-GS IVP training (run by val_before_train + test_freq).
# Scene-disjoint eval split. IVP needs the Habitat-GS render service.
envs:
  - name: HabitatGSInteractiveViewPlanning
    data_source: ae
    seed: [0, 251, 1]
    n_envs: 251
    max_turns: 10
    response_length_per_turn: 512
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs/interactive_view_planning_eval.jsonl
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      client_url_file_path: ${oc.env:VIEWSUITE_ROOT}/client_url_habitat_gs.txt
      render_backend: client
      max_turns: 10
      action_only_mode: true
      allow_rotate: false
      obs_format_bonus_reward: 0.01

  - name: HabitatGSPath2View
    data_source: path_to_view
    seed: [0, 251, 1]
    n_envs: 251
    max_turns: 1
    response_length_per_turn: 2048
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs/path_to_view_eval.jsonl
      image_size: [512, 512]
      format: eval_mode
      format_reward: 0.0
      answer_reward: 0.1

  - name: HabitatGSView2Path
    data_source: view_to_path
    seed: [0, 251, 1]
    n_envs: 251
    max_turns: 1
    response_length_per_turn: 2048
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs/view_to_path_eval.jsonl
      image_size: [512, 512]
      format: eval_mode
      format_reward: 0.0
      answer_reward: 0.1
