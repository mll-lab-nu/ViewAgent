defaults:
  - ../eval_default

fileroot: ${oc.env:VIEWSUITE_ROOT}

default_chat_config:
  temperature: 0.0
  max_tokens: 1024
  top_p: 1.0

# P2V + V2P only (no render service needed) — small n_envs for a smoke test.
envs:
  - name: Path2View
    n_envs: 16
    tag_id: path_to_view
    seed: [1, 16, 1]
    split: test
    max_turns: 1
    config:
      jsonl_path: ${fileroot}/data/viewagent15k_scannet_open3d/path_to_view_test.jsonl
      image_size: [512, 512]
      format: eval_mode
      example_count: 0
  - name: View2Path
    n_envs: 16
    tag_id: view_to_path
    seed: [1, 16, 1]
    split: test
    max_turns: 1
    config:
      jsonl_path: ${fileroot}/data/viewagent15k_scannet_open3d/view_to_path_test.jsonl
      image_size: [512, 512]
      format: eval_mode
      example_count: 0

experiment:
  dump_dir: ${fileroot}/rollouts/smoke_p2v_v2p
  default_max_turns: 1

run:
  backend: "sglang"
  base_seed: 0
  max_concurrent_jobs: 16
  resume: skip_completed
  live_summary: true

backends:
  sglang:
    base_url: "http://127.0.0.1:30000/v1"
    api_key: "EMPTY"
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    max_concurrency: 16
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
