defaults:
  - ../eval_default

fileroot: ${oc.env:VIEWSUITE_ROOT}

default_chat_config:
  temperature: 0.0
  max_tokens: 2048
  top_p: 0.95

# IVP only, tiny — needs a reachable render service in client_url.txt.
envs:
  - name: InteractiveViewPlanning
    n_envs: 8
    tag_id: interactive_view_planning
    seed: [1, 8, 1]
    split: test
    max_turns: 10
    config:
      jsonl_path: ${fileroot}/data/viewsuite_15k/interactive_view_planning_test.jsonl
      max_turns: 10
      render_backend: client
      client_url_file_path: ${fileroot}/client_url.txt
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      action_only_mode: true

experiment:
  dump_dir: ${fileroot}/rollouts/smoke_ivp
  default_max_turns: 10

run:
  backend: "sglang"
  base_seed: 0
  max_concurrent_jobs: 8
  resume: overwrite
  live_summary: true

backends:
  sglang:
    base_url: "http://127.0.0.1:30000/v1"
    api_key: "EMPTY"
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    max_concurrency: 8
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
