# Mesh (open3d) eval — matched-scene counterpart to eval_gs.yaml (exp 03).
# P2V/V2P read pre-rendered mesh images from disk; IVP renders live via the
# open3d service in client_url.txt (a 5090 render box). Same 530-scene test set.
defaults:
  - ../eval_default

fileroot: ${oc.env:VIEWSUITE_ROOT}

default_chat_config:
  temperature: 0.0
  max_tokens: 2048
  top_p: 0.95

envs:
  - name: Path2View
    n_envs: 530
    tag_id: path_to_view
    seed: [1, 530, 1]
    split: test
    max_turns: 1
    config:
      jsonl_path: ${fileroot}/data/viewsuite_15k/path_to_view_test_filter.jsonl
      image_size: [512, 512]
      format: eval_mode
      example_count: 0
  - name: View2Path
    n_envs: 530
    tag_id: view_to_path
    seed: [1, 530, 1]
    split: test
    max_turns: 1
    config:
      jsonl_path: ${fileroot}/data/viewsuite_15k/view_to_path_test_filter.jsonl
      image_size: [512, 512]
      format: eval_mode
      example_count: 0
  - name: InteractiveViewPlanning
    n_envs: 530
    tag_id: interactive_view_planning
    seed: [1, 530, 1]
    split: test
    max_turns: 10
    config:
      jsonl_path: ${fileroot}/data/viewsuite_15k/interactive_view_planning_test_filter.jsonl
      max_turns: 10
      render_backend: client
      client_url_file_path: ${fileroot}/client_url.txt
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      action_only_mode: true

experiment:
  dump_dir: ${fileroot}/rollouts/mesh/viewagent_all
  default_max_turns: 10

run:
  backend: "sglang"
  base_seed: 0
  max_concurrent_jobs: 32
  resume: overwrite
  live_summary: true

backends:
  sglang:
    base_url: "http://127.0.0.1:30000/v1"
    api_key: "EMPTY"
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    max_concurrency: 32
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
