# Reproduce GraphRL's val_smoke.yaml through the *eval* harness.
#
# Diagnostic, not a released config. Training-time val-aux/ae/traj_success read 0.375 on
# the 16-episode smoke validation while this harness reads 5.9% on the 288-sample test
# split. Those two numbers would steer different decisions, so it matters which is right.
# Everything here is set to val_smoke's values -- same split, same 16 seeds, same
# action_only_mode / allow_rotate / format bonus -- leaving the harness and the metric it
# computes as the only remaining difference.

fileroot: ${oc.env:VIEWSUITE_ROOT}

default_chat_config:
  temperature: 0.0
  max_tokens: 1024
  top_p: 1.0

envs:
  - name: HabitatGSInteractiveViewPlanning
    n_envs: 16
    tag_id: ivp_valsmoke_replica
    seed: [0, 16, 1]
    split: eval
    max_turns: 10
    config:
      jsonl_path: ${fileroot}/data/viewagent15k_habitat_gs/interactive_view_planning_eval.jsonl
      max_turns: 10
      render_backend: client
      client_url_file_path: ${fileroot}/client_url_habitat_gs.txt
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      action_only_mode: true
      allow_rotate: false
      obs_format_bonus_reward: 0.01

experiment:
  dump_dir: ${fileroot}/rollouts/ivp_valsmoke_replica
  default_max_turns: 10

run:
  backend: "sglang"
  base_seed: 0
  max_concurrent_jobs: 16
  resume: skip_completed
  live_summary: true

backends:
  sglang:
    base_url: "http://127.0.0.1:30000/v1"
    api_key: "EMPTY"
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    max_concurrency: 16
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
